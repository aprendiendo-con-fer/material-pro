<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenguajes - Material Pro</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Nunito', sans-serif; 
      padding-top: 80px; /* espacio para header fijo */
    }
    .font-fredoka { font-family: 'Fredoka', sans-serif; }

    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
    }

    .menu-btn {
      transition: all 0.3s ease;
    }
    .menu-btn:hover {
      transform: scale(1.08) translateY(-5px);
    }

    /* Header fijo */
    .fixed-header {
      width: 100%;
      background-color: #6b46c1; /* morado */
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .fixed-header button {
      background: white;
      color: #6b46c1;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .fixed-header button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body class="gradient-bg">

  <!-- HEADER FIJO -->
  <div class="fixed-header">
    <button onclick="history.back()">⬅ Volver</button>
    <h1 class="font-fredoka font-bold text-lg">Lenguajes</h1>
    <button onclick="window.location.href='index.html'">🏠</button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="max-w-5xl mx-auto text-center p-6">

    <p class="text-white text-lg mb-10 opacity-90">
     4  juegos disponibles
    </p>

    <div class="grid md:grid-cols-2 gap-6">

      <button onclick="window.location.href='alfabetizacionglobal.html'"
        class="menu-btn bg-gradient-to-r from-red-400 to-orange-500 p-8 rounded-3xl text-white text-2xl font-bold">
        🌎 Alfabetización Global
      </button>

      <button onclick="window.location.href='silabas.html'"
        class="menu-btn bg-gradient-to-r from-pink-400 to-rose-500 p-8 rounded-3xl text-white text-2xl font-bold">
        🔤 Sílabas
      </button>

            <button onclick="window.location.href='seplenguajes.html'"
        class="menu-btn bg-gradient-to-r from-pink-400 to-rose-500 p-8 rounded-3xl text-white text-2xl font-bold">
        ✏️ juegos español
      </button>

   <button onclick="window.location.href='ingles.html'"
          class="menu-btn bg-gradient-to-r from-red-400 to-orange-500 p-8 rounded-3xl text-white text-2xl font-bold">
        🎓 Juegos inglés
      </button>
      
    </div>

  </div>

</body>
</html>
