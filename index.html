<!doctype html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Pro</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; margin:0; height:100%; }

  .font-fredoka { font-family: 'Fredoka', sans-serif; }
  .menu-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .menu-btn:hover { transform: scale(1.08) translateY(-5px); }
  .menu-btn:active { transform: scale(1.15); }

  .floating { animation: floating 3s ease-in-out infinite; }
  @keyframes floating { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
  .floating-delay-1 { animation-delay:0.5s; }
  .floating-delay-2 { animation-delay:1s; }
  .floating-delay-3 { animation-delay:1.5s; }

  .sparkle { animation: sparkle 2s ease-in-out infinite; }
  @keyframes sparkle { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.6; transform:scale(1.2);} }

  .wiggle:hover { animation: wiggle 0.5s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-5deg);} 75%{transform:rotate(5deg);} }

  .btn-lenguajes { background: linear-gradient(135deg,#FF6B6B 0%,#FF8E53 100%); box-shadow: 0 8px 25px rgba(255,107,107,0.4); }
  .btn-lenguajes:hover { box-shadow: 0 12px 35px rgba(255,107,107,0.6); }
  .btn-saberes { background: linear-gradient(135deg,#4ECDC4 0%,#44A08D 100%); box-shadow:0 8px 25px rgba(78,205,196,0.4);}
  .btn-saberes:hover { box-shadow:0 12px 35px rgba(78,205,196,0.6);}
  .btn-etica { background: linear-gradient(135deg,#A770EF 0%,#CF8BF3 50%,#FDB99B 100%); box-shadow:0 8px 25px rgba(167,112,239,0.4);}
  .btn-etica:hover { box-shadow:0 12px 35px rgba(167,112,239,0.6);}
  .btn-humano { background: linear-gradient(135deg,#5B86E5 0%,#36D1DC 100%); box-shadow:0 8px 25px rgba(91,134,229,0.4);}
  .btn-humano:hover { box-shadow:0 12px 35px rgba(91,134,229,0.6);}
</style>
</head>
<body class="h-full bg-gradient-to-b from-amber-100 via-orange-50 to-yellow-100">

<div id="app" class="h-full w-full overflow-auto p-6">

  <!-- Título -->
  <div class="text-center mb-8">
    <div class="text-6xl mb-4 icon-bounce">🎨</div>
    <h1 class="text-5xl md:text-7xl font-fredoka font-bold text-orange-600 drop-shadow-lg mb-2">Material Pro</h1>
    <div class="flex justify-center gap-2 text-2xl sparkle">
      <span>📚</span><span>🎨</span><span>🎯</span><span>🌟</span>
    </div>
  </div>

  <!-- Botones del Menú -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <!-- Lenguajes -->
    <button class="menu-btn btn-lenguajes rounded-3xl p-6 text-white wiggle">
      <div class="flex flex-col items-center gap-3">
        <span class="text-5xl">📖</span>
        <span class="text-xl md:text-2xl font-fredoka font-bold">Lenguajes</span>
        <span class="text-sm opacity-90">Lectura, escritura y más</span>
      </div>
    </button>

    <!-- Saberes (a Tiendita) -->
    <button onclick="irATiendita()" class="menu-btn btn-saberes rounded-3xl p-6 text-white wiggle">
      <div class="flex flex-col items-center gap-3">
        <span class="text-5xl">🔬</span>
        <span class="text-xl md:text-2xl font-fredoka font-bold text-center">Saberes y Pensamientos Científicos</span>
        <span class="text-sm opacity-90">Ciencia y descubrimientos</span>
      </div>
    </button>

    <!-- Ética -->
    <button class="menu-btn btn-etica rounded-3xl p-6 text-white wiggle">
      <div class="flex flex-col items-center gap-3">
        <span class="text-5xl">🌿</span>
        <span class="text-xl md:text-2xl font-fredoka font-bold text-center">Ética, Naturaleza y Sociedades</span>
        <span class="text-sm opacity-90">Valores y comunidad</span>
      </div>
    </button>

    <!-- De lo Humano a lo Comunitario -->
    <button class="menu-btn btn-humano rounded-3xl p-6 text-white wiggle">
      <div class="flex flex-col items-center gap-3">
        <span class="text-5xl">👨‍👩‍👧‍👦</span>
        <span class="text-xl md:text-2xl font-fredoka font-bold text-center">De lo Humano a lo Comunitario</span>
        <span class="text-sm opacity-90">Convivencia y desarrollo</span>
      </div>
    </button>
  </div>

  <!-- Créditos -->
  <div class="text-center mt-6">
    <p class="text-sm text-orange-700">Material elaborado por Mtra. María Fernanda Flores Valenzuela</p>
  </div>

</div>

<script>
function irATiendita(){
    window.location.href = "tiendita.html";
}
</script>

</body>
</html>
