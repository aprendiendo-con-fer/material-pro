<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Menu System</title>
</head>
<body>
    <h1>Welcome to the Games Menu</h1>
    <nav>
        <ul>
            <li><a href="#login">Login</a></li>
            <li><a href="#terms">Terms and Conditions</a></li>
            <li>Games:
                <ul>
                    <li><strong>Category 1:</strong>
                        <ul>
                            <li><a href="#game1">Game 1</a></li>
                            <li><a href="#game2">Game 2</a></li>
                        </ul>
                    </li>
                    <li><strong>Category 2:</strong>
                        <ul>
                            <li><a href="#game3">Game 3</a></li>
                            <li><a href="#game4">Game 4</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>

    <div id="login">
        <h2>Login</h2>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <input type="submit" value="Login">
        </form>
    </div>

    <div id="terms">
        <h2>Terms and Conditions</h2>
        <p>Please read the terms and conditions carefully...</p>
    </div>

    <div id="games">
        <h2>Our Games</h2>
        <p>Select a game from the menu.</p>
    </div>
</body>
</html>
