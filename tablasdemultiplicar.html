<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Matemática</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; }
    .title-font { font-family: 'Fredoka One', cursive; }
    /* Animaciones */
    @keyframes float {0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(5deg);}}
    @keyframes pulse-glow {0%,100%{box-shadow:0 0 20px rgba(255,200,50,0.5);}50%{box-shadow:0 0 40px rgba(255,200,50,0.8);}}
    @keyframes shake {0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
    @keyframes star-burst {0%{transform:scale(0) rotate(0); opacity:1;}100%{transform:scale(2) rotate(180deg); opacity:0;}}
    @keyframes bounce-in {0%{transform:scale(0);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
    @keyframes slide-up {from{transform:translateY(20px); opacity:0;}to{transform:translateY(0); opacity:1;}}
    @keyframes confetti-fall {0%{transform:translateY(-100px) rotate(0);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
    
    .float-animation{animation:float 3s ease-in-out infinite;}
    .pulse-glow{animation:pulse-glow 2s ease-in-out infinite;}
    .shake{animation:shake 0.5s ease-in-out;}
    .bounce-in{animation:bounce-in 0.5s ease-out;}
    .slide-up{animation:slide-up 0.3s ease-out;}
    
    .star-particle{position:absolute;font-size:24px;animation:star-burst 0.6s ease-out forwards;pointer-events:none;}
    .gradient-bg{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);}
    .card-gradient{background:linear-gradient(145deg,#ffffff 0%,#f0f4ff 100%);}
    .btn-primary{background:linear-gradient(135deg,#ff6b6b 0%,#ff8e53 100%);transition:all 0.3s ease;}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,107,107,0.4);}
    .btn-secondary{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);transition:all 0.3s ease;}
    .btn-secondary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(79,172,254,0.4);}
    .table-btn{transition:all 0.2s ease;}
    .table-btn:hover{transform:scale(1.1);}
    .table-btn.selected{transform:scale(1.05);box-shadow:0 0 0 4px rgba(255,255,255,0.8);}
    .answer-btn{transition:all 0.2s ease;}
    .answer-btn:hover:not(:disabled){transform:scale(1.05);}
    .answer-btn:disabled{opacity:0.6;cursor:not-allowed;}
    .progress-bar{transition:width 0.1s linear;}
    .life-heart{transition:all 0.3s ease;}
    .life-heart.lost{transform:scale(0);opacity:0;}
    .combo-badge{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);}
    .leaderboard-row{transition:all 0.3s ease;}
    .leaderboard-row:hover{transform:translateX(5px);}
    .screen{display:none;}
    .screen.active{display:flex;}
    .confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000;}
    .home-btn{position:fixed;top:10px;left:10px;font-size:2rem;z-index:100;cursor:pointer;}
  </style>
</head>
<body class="h-full gradient-bg overflow-auto">
<div id="app" class="w-full min-h-full flex flex-col">

  <!-- Botón de Inicio (Casita) -->
  <div class="home-btn" id="home-btn" title="Volver al Inicio">🏠</div>

  <!-- Pantalla de Inicio -->
  <div id="welcome-screen" class="screen active flex-col items-center justify-center p-4 min-h-full">
    <div class="text-center mb-8 slide-up">
      <div class="text-6xl mb-4 float-animation">🚀</div>
      <h1 id="main-title" class="title-font text-4xl md:text-6xl text-white drop-shadow-lg mb-2">Aventura Matemática</h1>
      <p id="subtitle" class="text-xl md:text-2xl text-white/90">¡Conviértete en un Maestro de las Tablas!</p>
    </div>
    <div class="card-gradient rounded-3xl p-6 md:p-8 shadow-2xl w-full max-w-md bounce-in">
      <div class="mb-6">
        <label class="block text-gray-700 font-bold mb-2 text-lg">👤 Tu nombre de héroe:</label>
        <input type="text" id="player-name-input" placeholder="Escribe tu nombre..." class="w-full px-4 py-3 rounded-xl border-2 border-purple-200 focus:border-purple-500 focus:outline-none text-lg transition-all">
      </div>
      <button id="start-btn" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-xl shadow-lg">🎮 ¡Comenzar Aventura!</button>
      <button id="leaderboard-btn" class="btn-secondary w-full py-3 rounded-xl text-white font-bold text-lg shadow-lg mt-4">🏆 Ver Ranking</button>
    </div>
    <div class="mt-8 text-center text-white/80 text-sm max-w-md">
      <p id="author-credit">Material creado con ❤️ por la Maestra María Fernanda Flores Valenzuela</p>
      <button id="terms-btn" class="underline mt-2 hover:text-white transition-colors">📜 Términos y Condiciones</button>
    </div>
  </div>

  <!-- Aquí seguiría el resto de pantallas (select-screen, game-screen, results-screen, leaderboard-screen, terms-modal) -->
  <!-- Puedes copiar las demás secciones desde tu HTML anterior tal cual -->

</div>

<script>
  // Función del botón de Casita
  document.getElementById('home-btn').addEventListener('click', () => {
    // Limpiar datos si quieres reiniciar el juego
    gameState = {...gameState, currentQuestion:0, score:0, lives:3, combo:0, maxCombo:0, correctAnswers:0, wrongAnswers:0};
    showScreen('welcome-screen');
  });

  // Función para mostrar pantalla
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }
</script>

</body>
</html>
