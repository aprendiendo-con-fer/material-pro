  <style>
    * { font-family: 'Nunito', sans-serif; }
    .title-font { font-family: 'Fredoka', sans-serif; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,255,255,0.6); }
    }
    @keyframes bounce-in {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes slide-up {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }
    .float { animation: float 3s ease-in-out infinite; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .bounce-in { animation: bounce-in 0.6s ease-out; }
    .slide-up { animation: slide-up 0.5s ease-out forwards; }
    
    .grade-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .grade-btn:hover {
      transform: translateY(-8px) scale(1.02);
    }
    
    .option-btn {
      transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
      transform: scale(1.02);
    }
    .option-btn.correct {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: white !important;
      border-color: #059669 !important;
    }
    .option-btn.incorrect {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: white !important;
      border-color: #dc2626 !important;
    }
    
    .progress-fill {
      transition: width 0.5s ease-out;
    }
    
    .star {
      display: inline-block;
      animation: bounce-in 0.5s ease-out backwards;
    }
    
    .area-card {
      transition: all 0.3s ease;
    }
    .area-card:hover {
      transform: translateY(-5px);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>

    function selectAnswer(index) {
      if (answered) return;
      answered = true;
      
      const question = questionsData[currentQuestionIndex];
      const isCorrect = index === question.correct;
      
      if (isCorrect) {
        score++;
      }
      
      // Marcar respuestas
      question.options.forEach((_, i) => {
        const btn = document.getElementById(`option-${i}`);
        if (i === question.correct) {
          btn.classList.add('correct');
        } else if (i === index && !isCorrect) {
          btn.classList.add('incorrect');
        }
        btn.disabled = true;
      });
      
      // Mostrar botón siguiente
      document.getElementById('next-container').classList.remove('hidden');
      document.getElementById('next-container').classList.add('bounce-in');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      answered = false;
      
      if (currentQuestionIndex >= questionsData.length) {
        currentView = 'results';
        renderResults();
      } else {
        renderQuiz();
      }
    }

        bgColor = 'from-blue-400 to-cyan-500';

      const stars = Math.min(5, Math.ceil(percentage / 20));

                  </button>
                  <button onclick="goHome()" 
                          class="w-full bg-white border-2 border-gray-200 hover:border-indigo-400 text-gray-700 font-bold py-4 rounded-2xl text-lg transition-all">
                    🏠 Volver al inicio
                  </button>
                </div>
              </div>
            </div>
            
            <!-- Mensaje motivacional -->
            <div class="mt-6 text-center text-white/90 slide-up" style="animation-delay: 0.5s;">
              <p class="text-lg">
                ${percentage >= 60 
                  ? '🎉 ¡Sigue así! Estás preparándote muy bien para el SISAT.' 
                  : '💪 La práctica hace al maestro. ¡Cada intento te hace mejor!'}
              </p>
            </div>
          </div>
        </div>
      `;
    }

    function goHome() {
      currentView = 'home';
      currentGrade = null;
      currentArea = null;
      renderHome();
    }

    function backToAreas() {
      currentView = 'areas';
      currentArea = null;
      renderAreas();
    }

    function onConfigChange(newConfig) {
      const titleEl = document.getElementById('main-title');
      if (titleEl) {
        titleEl.textContent = newConfig.app_title || defaultConfig.app_title;
      }
      
      const authorEl = document.getElementById('author-credit');
      if (authorEl) {
        const authorName = newConfig.author_name || defaultConfig.author_name;
        authorEl.innerHTML = `Material creado con amor por <span class="text-purple-700">${authorName}</span>`;
      }
    }

    // Inicialización
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (newConfig) => {
          config = { ...defaultConfig, ...newConfig };
          onConfigChange(config);
        },
        mapToCapabilities: (cfg) => ({
          recolorables: [
            {
              get: () => cfg.primary_color || defaultConfig.primary_color,
              set: (v) => { cfg.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); }
            },
            {
              get: () => cfg.secondary_color || defaultConfig.secondary_color,
              set: (v) => { cfg.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); }
            },
            {
              get: () => cfg.text_color || defaultConfig.text_color,
              set: (v) => { cfg.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
            },
            {
              get: () => cfg.accent_color || defaultConfig.accent_color,
              set: (v) => { cfg.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); }
            },
            {
              get: () => cfg.button_color || defaultConfig.button_color,
              set: (v) => { cfg.button_color = v; window.elementSdk.setConfig({ button_color: v }); }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (cfg) => new Map([
          ['app_title', cfg.app_title || defaultConfig.app_title],
          ['author_name', cfg.author_name || defaultConfig.author_name]
        ])
      });
    }
    
    // Renderizar vista inicial
    renderHome();
  </script>
