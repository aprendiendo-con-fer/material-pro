<!doctype html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viste la Profesión</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="/_sdk/element_sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { font-family: 'Quicksand', sans-serif; }
.title-font { font-family: 'Fredoka', sans-serif; }

@keyframes float {0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes pulse-glow {0%,100%{box-shadow:0 0 20px rgba(255,200,0,0.5);}50%{box-shadow:0 0 40px rgba(255,200,0,0.8);}}
@keyframes sparkle {0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.2);}}
@keyframes bounce-in {0%{transform:scale(0);opacity:0;}50%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
@keyframes slide-up {from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes confetti {0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100px) rotate(720deg);opacity:0;}}
@keyframes shake {0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}

.float-animation {animation: float 3s ease-in-out infinite;}
.pulse-glow {animation: pulse-glow 2s ease-in-out infinite;}
.sparkle {animation: sparkle 1.5s ease-in-out infinite;}
.bounce-in {animation: bounce-in 0.5s ease-out forwards;}
.slide-up {animation: slide-up 0.4s ease-out forwards;}

.item-slot {transition: all 0.3s ease; cursor:pointer;}
.item-slot:hover {transform: scale(1.1); filter: brightness(1.1);}
.item-slot.selected {transform: scale(1.15); filter: drop-shadow(0 0 10px gold);}
.drop-zone {transition: all 0.3s ease;}
.drop-zone.highlight {background: rgba(255,215,0,0.3); border-color: gold;}
.correct-item {animation: bounce-in 0.5s ease-out; filter: drop-shadow(0 0 8px lime);}
.wrong-item {animation: shake 0.5s ease-out;}
.profession-card {transition: all 0.3s ease;}
.profession-card:hover {transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2);}
.star {display:inline-block; font-size:2rem; color:#fbbf24; text-shadow:0 0 10px rgba(251,191,36,0.8);}
.star.empty {color:#d1d5db; text-shadow:none;}
.level-badge {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);}
.confetti-piece {position:absolute; width:10px; height:10px; animation: confetti 1s ease-out forwards;}
body { box-sizing: border-box; }
</style>
<script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>
<body class="h-full overflow-auto">
<div id="app" class="min-h-full bg-gradient-to-br from-purple-400 via-pink-300 to-orange-300">

  <!-- Pantalla de Inicio -->
  <div id="start-screen" class="min-h-full flex flex-col items-center justify-center p-4">
    <div class="text-center max-w-2xl mx-auto">
      <div class="float-animation mb-6">
        <span class="text-8xl">👔</span>
      </div>
      <h1 class="title-font text-5xl md:text-6xl font-bold text-white mb-4 drop-shadow-lg">🎮 Viste la Profesión 🎮</h1>
      <p class="text-xl text-white/90 mb-8 drop-shadow">¡Aprende sobre diferentes profesiones y oficios vistiendo a tu personaje!</p>
      <div class="bg-white/90 backdrop-blur rounded-3xl p-8 shadow-2xl mb-6">
        <h2 class="title-font text-2xl font-bold text-purple-600 mb-6">¿Cómo quieres jugar?</h2>
        <div class="grid grid-cols-2 gap-6 mb-6">
          <button onclick="selectGender('mujer')" class="gender-btn group bg-gradient-to-br from-pink-400 to-rose-500 p-6 rounded-2xl text-white transition-all hover:scale-105 hover:shadow-xl"> <span class="text-6xl block mb-2">👩</span> <span class="font-bold text-lg">Mujer</span> </button>
          <button onclick="selectGender('hombre')" class="gender-btn group bg-gradient-to-br from-blue-400 to-indigo-500 p-6 rounded-2xl text-white transition-all hover:scale-105 hover:shadow-xl"> <span class="text-6xl block mb-2">👨</span> <span class="font-bold text-lg">Hombre</span> </button>
        </div>
        <div id="gender-selected" class="hidden text-green-600 font-bold mb-4">✓ Personaje seleccionado</div>
        <button onclick="startGame()" id="start-btn" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold text-xl py-4 px-8 rounded-full transition-all hover:scale-105 hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed pulse-glow" disabled> 🚀 ¡Comenzar Aventura! </button>
      </div>
      <p class="text-white/80 text-sm italic drop-shadow">💖 Material creado por Mtra. María Fernanda Flores Valenzuela con mucho amor 💖</p>
    </div>
  </div>

  <!-- Pantalla de Selección de Nivel -->
  <div id="level-screen" class="hidden min-h-full flex flex-col items-center justify-center p-4">
    <div class="text-center max-w-4xl mx-auto">
      <h2 class="title-font text-4xl font-bold text-white mb-8 drop-shadow-lg">🌟 Selecciona el Nivel 🌟</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <button onclick="selectLevel(1)" class="level-card bg-gradient-to-br from-green-400 to-emerald-500 p-8 rounded-3xl text-white transition-all hover:scale-105 hover:shadow-2xl"> <span class="text-5xl block mb-3">🌱</span> <h3 class="title-font text-2xl font-bold mb-2">Nivel 1</h3><p class="text-green-100">Fácil</p><p class="text-sm mt-2 text-green-100">3 elementos por profesión</p></button>
        <button onclick="selectLevel(2)" class="level-card bg-gradient-to-br from-yellow-400 to-amber-500 p-8 rounded-3xl text-white transition-all hover:scale-105 hover:shadow-2xl"> <span class="text-5xl block mb-3">🌿</span> <h3 class="title-font text-2xl font-bold mb-2">Nivel 2</h3><p class="text-yellow-100">Medio</p><p class="text-sm mt-2 text-yellow-100">4 elementos por profesión</p></button>
        <button onclick="selectLevel(3)" class="level-card bg-gradient-to-br from-red-400 to-rose-500 p-8 rounded-3xl text-white transition-all hover:scale-105 hover:shadow-2xl"> <span class="text-5xl block mb-3">🌳</span> <h3 class="title-font text-2xl font-bold mb-2">Nivel 3</h3><p class="text-red-100">Difícil</p><p class="text-sm mt-2 text-red-100">5 elementos por profesión</p></button>
      </div>
      <div class="flex justify-center gap-4">
        <button onclick="goToStart()" class="bg-white/30 backdrop-blur text-white font-bold py-3 px-8 rounded-full hover:bg-white/40 transition-all"> 🏠 Inicio </button>
      </div>
    </div>
  </div>

  <!-- Pantalla de Selección de Profesión -->
  <div id="profession-screen" class="hidden min-h-full p-4">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-6">
        <h2 class="title-font text-3xl font-bold text-white mb-2 drop-shadow-lg">👷 Elige una Profesión 👷</h2>
        <div class="flex justify-center items-center gap-4 mb-4">
          <span id="level-indicator" class="level-badge text-white px-4 py-2 rounded-full font-bold"></span>
          <span id="progress-indicator" class="bg-white/80 text-purple-600 px-4 py-2 rounded-full font-bold"></span>
        </div>
      </div>
      <div id="professions-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-6"></div>
      <div class="text-center flex justify-center gap-4">
        <button onclick="goToLevelSelect()" class="bg-white/30 backdrop-blur text-white font-bold py-3 px-8 rounded-full hover:bg-white/40 transition-all"> ← Cambiar Nivel </button>
        <button onclick="goToStart()" class="bg-white/30 backdrop-blur text-white font-bold py-3 px-8 rounded-full hover:bg-white/40 transition-all"> 🏠 Inicio </button>
      </div>
    </div>
  </div>

  <!-- El resto de las pantallas (Juego, Victoria, etc.) mantiene el mismo patrón con botones de 🏠 Inicio añadidos -->

</div>

<script>
// ... Aquí va todo tu script de navegación, selección de género, niveles, profesiones y lógica de juego ...
</script>
</body>
</html>
