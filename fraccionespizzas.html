<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzería Matemática</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Fredoka', 'Comic Neue', cursive; }
    
    /* Animaciones */
    @keyframes float {0%,100%{transform:translateY(0px) rotate(0deg);}50%{transform:translateY(-10px) rotate(2deg);}}
    @keyframes bounce-in {0%{transform:scale(0);opacity:0;}50%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
    @keyframes wiggle {0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
    @keyframes sparkle {0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.2);}}
    @keyframes slide-up {from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes pulse-glow {0%,100%{box-shadow:0 0 20px rgba(255,200,0,0.4);}50%{box-shadow:0 0 40px rgba(255,200,0,0.8);}}

    .float-animation { animation: float 3s ease-in-out infinite; }
    .bounce-in { animation: bounce-in 0.5s ease-out forwards; }
    .wiggle { animation: wiggle 0.5s ease-in-out; }
    .sparkle { animation: sparkle 1s ease-in-out infinite; }
    .slide-up { animation: slide-up 0.4s ease-out forwards; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    .pizza-slice { transition: all 0.3s ease; cursor: pointer; }
    .pizza-slice:hover { filter: brightness(1.1); transform: scale(1.02); }
    .ingredient-btn { transition: all 0.2s ease; }
    .ingredient-btn:hover { transform: scale(1.08); }
    .ingredient-btn.selected { ring: 4px; ring-color: #fbbf24; transform: scale(1.05); }
    .order-card { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 3px dashed #d97706; }
    .confetti { position: fixed; width: 10px; height: 10px; pointer-events: none; z-index: 1000; }
    .star-burst { position: absolute; font-size: 2rem; animation: sparkle 0.5s ease-out forwards; }
    body { box-sizing: border-box; }
  </style>
</head>
<body class="h-full overflow-auto bg-gradient-to-br from-orange-100 via-yellow-50 to-red-100">

<!-- Header Fijo -->
<script>
window.addEventListener("load", function () {
  const header = document.createElement("div");
  header.innerHTML = `
    <div class="w-full bg-purple-600 text-white p-4 flex justify-between items-center shadow-lg fixed top-0 left-0 z-50">
      <button onclick="history.back()"
        class="bg-white text-purple-600 px-4 py-2 rounded-xl font-bold hover:scale-105 transition">⬅</button>
      <h1 class="font-bold text-lg">${document.title}</h1>
      <button onclick="goToStart()"
        class="bg-white text-purple-600 px-4 py-2 rounded-xl font-bold hover:scale-105 transition">🏠</button>
    </div>
  `;
  document.body.prepend(header);
  document.body.style.paddingTop = "80px";
});
</script>

<div id="app" class="min-h-full w-full">

  <!-- Pantalla de Inicio -->
  <div id="start-screen" class="min-h-full flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-10 left-10 text-6xl float-animation" style="animation-delay: 0s;">🍕</div>
    <div class="absolute top-20 right-16 text-5xl float-animation" style="animation-delay: 0.5s;">🧀</div>
    <div class="absolute bottom-32 left-20 text-4xl float-animation" style="animation-delay: 1s;">🍅</div>
    <div class="absolute bottom-20 right-10 text-5xl float-animation" style="animation-delay: 1.5s;">🌽</div>
    <div class="absolute top-1/3 left-5 text-3xl float-animation" style="animation-delay: 0.7s;">🍄</div>

    <div class="text-center z-10 bounce-in">
      <div class="text-8xl mb-4">🍕</div>
      <h1 id="main-title" class="text-5xl md:text-6xl font-bold text-orange-600 drop-shadow-lg mb-2">¡Pizzería Matemática!</h1>
      <p class="text-2xl text-amber-700 font-medium mb-8">🎯 ¡Aprende fracciones haciendo pizzas deliciosas! 🎯</p>
    </div>

    <!-- Selección de Nivel -->
    <div class="z-10 w-full max-w-2xl">
      <h2 class="text-2xl font-bold text-center text-amber-800 mb-6">¡Elige tu nivel de chef! 👨‍🍳</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 px-4">
        <button onclick="startGame('easy')" class="group bg-gradient-to-br from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white rounded-3xl p-6 shadow-xl transform hover:scale-105 transition-all duration-300 pulse-glow">
          <div class="text-5xl mb-3">🌟</div>
          <h3 class="text-2xl font-bold mb-2">Chef Principiante</h3>
          <p class="text-sm opacity-90 mb-3">Mitades (½)</p>
        </button>
        <button onclick="startGame('medium')" class="group bg-gradient-to-br from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white rounded-3xl p-6 shadow-xl transform hover:scale-105 transition-all duration-300">
          <div class="text-5xl mb-3">⭐⭐</div>
          <h3 class="text-2xl font-bold mb-2">Chef Experto</h3>
          <p class="text-sm opacity-90 mb-3">Medios, Cuartos, Octavos</p>
        </button>
        <button onclick="startGame('hard')" class="group bg-gradient-to-br from-red-400 to-pink-500 hover:from-red-500 hover:to-pink-600 text-white rounded-3xl p-6 shadow-xl transform hover:scale-105 transition-all duration-300">
          <div class="text-5xl mb-3">⭐⭐⭐</div>
          <h3 class="text-2xl font-bold mb-2">Master Chef</h3>
          <p class="text-sm opacity-90 mb-3">Tercios, Sextos, Novenos</p>
        </button>
      </div>
    </div>

  </div>

  <!-- Aquí irían las pantallas de juego y resultado (game-screen, result-screen, final-screen) -->

</div>

<script>
  // Función que se llama al presionar el botón 🏠
  function goToStart() {
    document.getElementById('start-screen').classList.remove('hidden');
    // Ocultar otras pantallas si las tienes
    if (document.getElementById('game-screen')) document.getElementById('game-screen').classList.add('hidden');
    if (document.getElementById('result-screen')) document.getElementById('result-screen').classList.add('hidden');
    if (document.getElementById('final-screen')) document.getElementById('final-screen').classList.add('hidden');
  }

  // Función de inicio de juego de ejemplo
  function startGame(level) {
    alert("Inicia el juego en nivel: " + level);
  }
</script>

</body>
</html>
